<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The saved accent ($docs/accent) before the first paint.
      try {
        const a = JSON.parse(localStorage.getItem("vitrea:accent") || "null");
        if (a) {
          document.documentElement.style.setProperty("--accent-h", a.h);
          document.documentElement.style.setProperty("--accent-c", a.c);
        }
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
